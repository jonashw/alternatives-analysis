name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and deploy are separate jobs, as in GitHub's own Pages starter workflows. With both in one job,
  # deploy-pages sometimes looks up the artifact a moment after upload and finds none (seen 2026-11-24),
  # and a re-run then fails on two artifacts with the same name. A separate job starts after the upload is listed.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test toolkit/pairwise.test.mjs toolkit/custom.test.mjs
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: build/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
